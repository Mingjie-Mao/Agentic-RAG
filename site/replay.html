<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic-RAG · 真实执行回放</title>
<style>
:root{font-family:system-ui,"PingFang SC",sans-serif;color:#233d35;background:#eef2ef;font-size:15px}*{box-sizing:border-box}body{margin:0}a{color:#275b4d}button{font:inherit;color:inherit;cursor:pointer;background:white;border:1px solid #cad8cf;border-radius:8px;padding:10px 14px}button:hover{background:#e4efe7}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #275b4d;outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 30px;background:#fff;border-bottom:1px solid #d5e0d8}header nav{display:flex;gap:20px;font-size:14px}.wrap{max-width:1180px;margin:auto;padding:35px 28px}h1{font-size:30px;margin:12px 0}h2{font-size:22px}h3{font-size:18px}.kicker{font-size:12px;letter-spacing:.12em;color:#526b5d}.intro{color:#52675c;line-height:1.8;max-width:850px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#dcebe0;font-size:13px}#scenarios{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}#scenarios button.active{background:#275b4d;color:white}.panel{background:white;border:1px solid #d5e0d8;border-radius:12px;padding:24px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.goal{font-size:17px;line-height:1.8;background:#f1f6ef;padding:16px;border-radius:8px}.controls{display:flex;gap:10px;align-items:center;margin:20px 0}.steps{display:flex;flex-direction:column;gap:8px;margin:18px 0}.steps button{text-align:left;font-size:14px}.steps button.selected{border-color:#275b4d;background:#edf5ef}.steps small{display:block;margin:5px 0;color:#52675c}.answer p{font-size:17px;line-height:1.9}.answer button{display:block;width:100%;text-align:left;margin-top:10px}.evidence{white-space:pre-wrap;line-height:1.85;font-size:16px;background:#f1f6ef;padding:20px;border-left:3px solid #8da587}.muted{color:#52675c;font-size:13px;line-height:1.8}.notice{padding:16px;background:#f7efd9;color:#66501e;border-radius:8px;line-height:1.8}.permission-table{width:100%;border-collapse:collapse;font-size:15px}.permission-table th,.permission-table td{text-align:left;padding:16px;border-bottom:1px solid #d5e0d8}.allow{color:#22653d}.deny{color:#934828}#permissions{margin-top:40px;scroll-margin-top:20px}footer{margin-top:30px;color:#52675c;font-size:13px}details{margin-top:20px}summary{cursor:pointer}@media(max-width:760px){header{padding:15px;flex-wrap:wrap}.wrap{padding:25px 16px}.grid{grid-template-columns:1fr}.panel{padding:18px}.permission-table th,.permission-table td{padding:10px;font-size:13px}h1{font-size:26px}.controls{flex-wrap:wrap}}
</style></head><body>
<header><strong>Agentic-RAG · 星桥软件模拟企业环境</strong><nav><a href="/">项目介绍</a><a href="/live#agent">在线体验</a><a href="https://github.com/Mingjie-Mao/Agentic-RAG">GitHub ↗</a></nav></header>
<main class="wrap"><span class="kicker">RECORDED REAL EXECUTION</span><h1>逐步查看一次真实查证</h1><span class="badge">真实历史回放 · 不消耗额度</span>
<p class="intro">选择一个场景，逐步查看工具调用、答案与引用原文。</p>
<details><summary>执行记录</summary><p id="provenance" class="muted">正在加载录制信息…</p></details><nav id="scenarios" aria-label="回放场景"></nav>
<div id="error" class="notice" hidden>回放文件暂时无法加载，请刷新重试。<a href="/">返回项目介绍</a></div>
<div class="grid"><section class="panel"><h2 id="title">真实执行记录</h2><p id="execution" class="muted"></p><div id="goal" class="goal"></div><div class="controls"><button id="previous">上一步</button><span id="position"></span><button id="next">下一步</button><button id="result">查看最终结果</button></div><div id="steps" class="steps" aria-label="已录制执行步骤"></div><div id="answer" class="answer" aria-live="polite"></div></section>
<aside class="panel"><h2>来源与证据</h2><p class="muted">查看当次查证引用的原文片段。</p><h3 id="source-title">选择引用查看原文</h3><p id="locator" class="muted"></p><div id="source" class="evidence">点击最终答案中的引用。</div></aside></div>
<section id="permissions" class="panel"><h2>同一份资料，不同角色的权限</h2><p class="intro">对比同一份资料在支持组与工程组下的访问结果。</p><div id="permission-data"></div><details><summary>权限核对记录</summary><p id="permission-source" class="muted"></p></details></section>
<footer>全部企业资料与角色均为虚构。<a href="https://github.com/Mingjie-Mao/Agentic-RAG/blob/main/PROJECT_REPORT.md">查看技术报告与评测边界</a></footer></main>
<script>
if(new URLSearchParams(location.search).get("embedded")==="1") document.querySelector("header").style.display="none";
let capture=null,selected=0,step=0;
const byId=id=>document.getElementById(id);
const labels={search_documents:"查找可访问资料",retrieve_evidence:"提取原文证据",open_document:"阅读指定资料",compare_versions:"比较版本差异",get_document_version:"查阅版本记录",verify_chunk_access:"检查当前权限"};
const eventLabels={task_created:"任务已创建",task_started:"开始查证",generation_context:"准备生成所需证据",coverage_check:"检查问题覆盖情况",task_completed:"返回核验结果",task_failed:"任务未完成"};
const statuses={answered:"附原文依据",conflict:"资料存在冲突",insufficient_evidence:"依据不足，明确拒答",verification_failed:"引用未通过核验"};
function showSource(source){byId("source-title").textContent=source.title;byId("locator").textContent=source.locator.label;byId("source").textContent=source.text;}
function render(){
 const scenario=capture.scenarios[selected];const steps=scenario.events.filter(e=>e.tool_name||eventLabels[e.event_type]);const count=Math.max(1,steps.length);step=Math.min(step,count);byId("title").textContent=scenario.title;byId("goal").textContent=scenario.goal;
 byId("execution").textContent=scenario.mode==="workflow"?"执行方式：固定工作流":scenario.mode?`执行方式：${scenario.mode}`:"执行方式：知识问答";
 byId("position").textContent=step===count?"最终结果":`步骤 ${step+1} / ${count}`;byId("previous").disabled=step===0;byId("next").disabled=step===count;byId("steps").replaceChildren();
 steps.slice(0,step===count?count:step+1).forEach((event,index)=>{const button=document.createElement("button");button.className=index===step?"selected":"";button.textContent=`${index+1}. ${labels[event.tool_name]||eventLabels[event.event_type]||"更新查证状态"}`;const meta=document.createElement("small");meta.textContent=`${event.evidence_count} 条证据${typeof event.wall_ms==="number"?` · ${(event.wall_ms/1000).toFixed(1)} 秒`:""}`;button.append(meta);button.onclick=()=>{step=index;render()};byId("steps").append(button)});
 byId("answer").replaceChildren();
 if(step===count){const badge=document.createElement("span");badge.className="badge";badge.textContent=statuses[scenario.status]||scenario.status;byId("answer").append(badge);for(const claim of scenario.claims){const p=document.createElement("p");p.textContent=claim.text;byId("answer").append(p)}if(!scenario.claims.length){const p=document.createElement("p");p.textContent=scenario.message;byId("answer").append(p)}scenario.evidence.forEach((source,index)=>{const button=document.createElement("button");button.textContent=`引用 ${index+1} · ${source.title} · ${source.locator.label}`;button.onclick=()=>showSource(source);byId("answer").append(button)});}
 else{const p=document.createElement("p");p.className="muted";p.textContent="这是已录制的执行步骤。继续查看或点击“查看最终结果”。";byId("answer").append(p)}
 byId("scenarios").querySelectorAll("button").forEach((button,index)=>button.classList.toggle("active",index===selected));
}
fetch("replay-20261009T072349Z.json").then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{capture=data;byId("provenance").textContent=`录制时间：${new Date(data.recorded_at).toLocaleString("zh-CN")} · 模型：${data.model} · 真实执行 / 虚构语料`;
 data.scenarios.forEach((scenario,index)=>{const button=document.createElement("button");button.textContent=scenario.title;button.onclick=()=>{selected=index;step=0;byId("source-title").textContent="选择引用查看原文";byId("source").textContent="点击最终答案中的引用。";byId("locator").textContent="";render()};byId("scenarios").append(button)});render();}).catch(()=>{byId("error").hidden=false;byId("provenance").textContent="录制信息暂时不可用";});
byId("previous").onclick=()=>{step=Math.max(0,step-1);render()};byId("next").onclick=()=>{step++;render()};byId("result").onclick=()=>{step=10000;render()};
fetch("permission-demo-20261009.json").then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{const table=document.createElement("table");table.className="permission-table";const head=document.createElement("tr");["固定虚构文档","支持组角色","工程组角色"].forEach(label=>{const th=document.createElement("th");th.textContent=label;head.append(th)});table.append(head);data.rows.forEach(row=>{const tr=document.createElement("tr");const title=document.createElement("td");title.textContent=row.title;tr.append(title);["xq-support","xq-engineer"].forEach(role=>{const value=row.roles.find(r=>r.role===role);const td=document.createElement("td");td.textContent=value?(value.allowed?"允许查阅":"不可见 / 拒绝读取"):"pending";td.className=value?.allowed?"allow":"deny";tr.append(td)});table.append(tr)});byId("permission-data").append(table);byId("permission-source").textContent=`来源：服务端 can_read 对预置文档的实际鉴权 · ${new Date(data.recorded_at).toLocaleString("zh-CN")}`}).catch(()=>{byId("permission-data").textContent="权限对照记录暂时无法加载。";});
</script></body></html>
